name: security

# No `paths:` filter on purpose. Secrets can land in any file, and this job is
# meant to become a required status check — a filtered workflow that never runs
# leaves such a check permanently pending on unrelated PRs.
on:
  push:
    branches: [main]
  pull_request:
  # Callable from the per-service workflows, so a build never starts on a commit
  # this scan has already rejected.
  workflow_call:
    inputs:
      skip_upload:
        description: Skip publishing SARIF; set by callers whose commit the standalone run already reports on.
        type: boolean
        default: false

permissions:
  contents: read
  # Needed to publish findings as code scanning alerts. Nothing else is granted;
  # the default token scope is far wider than this job needs.
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep in step with the version developers run locally via .pre-commit-config.yaml,
      # so a scan that passes on a workstation passes here for the same reasons.
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be repointed at
      # different code without anything changing in this repo. Renovate proposes
      # SHA bumps as reviewable PRs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: gitleaks scans commits, and the default shallow clone
          # hides a secret that was committed and later deleted — the file is
          # gone from the tree, the secret is still in history, scan reports clean.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL --fail \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          # Fail closed if the asset is not byte-for-byte what we pinned: this
          # binary runs unsandboxed in CI, so an unverified download is a direct
          # path into the pipeline.
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact is mandatory here: run logs are visible to anyone with read
      # access and are retained, so an unredacted finding would spread the secret
      # further than the commit did.
      - name: Scan git history for secrets
        run: |
          ./gitleaks git \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      # `always()` because the step above exits non-zero exactly when there is
      # something worth publishing — without it, findings would only ever be
      # uploaded on clean runs.
      # `inputs` is empty on push/pull_request, so the negation leaves the
      # standalone run uploading as before; only an explicit caller opts out.
      - name: Upload findings to code scanning
        if: always() && !inputs.skip_upload
        uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3.37.6
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
