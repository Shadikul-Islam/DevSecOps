name: api-service-ci

on:
  push:
    branches: [main]
    paths:
      - "api-service/**"
      - ".github/workflows/api-service-ci.yml"
      # This workflow now calls security.yml, so a change there changes what
      # runs here.
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "api-service/**"
      - ".github/workflows/api-service-ci.yml"
      # This workflow now calls security.yml, so a change there changes what
      # runs here.
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  # Gate. The image built below goes nowhere today, but once it is pushed to a
  # registry a leaked commit becomes a published artifact — the dependency is
  # cheapest to wire now, before that is true.
  secret-scan:
    uses: ./.github/workflows/security.yml
    with:
      # The standalone `security` run already publishes this commit's SARIF.
      # Two uploads under one category for the same commit read as competing
      # analyses of the same tool, and the alert list flip-flops between them.
      skip_upload: true

  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: api-service/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check sources
        run: node --check src/index.js && node --check src/app.js

      - name: Build Docker image
        run: docker build -t api-service:ci .
